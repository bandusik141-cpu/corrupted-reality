<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrupted Reality</title>

<style>
body{margin:0;overflow:hidden;background:black;}
canvas{display:block;}

#menu{
  position:fixed;inset:0;
  background:black;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  font-family:monospace;
  z-index:10;
}
#menu button{margin:10px;padding:10px 30px;font-size:20px;}

#openText{
  position:fixed;bottom:20%;
  width:100%;text-align:center;
  font-family:monospace;font-size:22px;
  color:white;opacity:0;transition:.2s;
  pointer-events:none;z-index:5;
}

#vignette{
  position:fixed;inset:0;
  pointer-events:none;
  background:radial-gradient(circle,
    rgba(0,0,0,0) 60%,
    rgba(30,15,0,0.55) 100%);
  z-index:4;
}
</style>
</head>

<body>

<div id="menu">
  <h1>Corrupted Reality</h1>
  <button id="play">Play</button>
  <button>Settings</button>
</div>

<div id="openText">OPEN</div>
<div id="vignette"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
let started=false;
play.onclick=()=>{menu.style.display="none";started=true;}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111111);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,100);
camera.position.set(0,1.6,2);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* Свет */
scene.add(new THREE.AmbientLight(0x664422,0.4));

/* Текстуры */
const L=new THREE.TextureLoader();
const floorTex=L.load("https://i.postimg.cc/qMrFMmrT/tmpfdd10f506ecf00611c27c317004b7676.jpg");
const wallTex=L.load("https://i.postimg.cc/J4wQ1tbR/Untitled30-20260102223542.png");
const ceilTex=L.load("https://i.postimg.cc/wvdryFNx/Untitled32-20260102230233.png");
const doorTex=L.load("https://i.postimg.cc/9QJ2cSNz/pngtree-door-on-old-wall-png-image-11573440.png");
doorTex.flipY=false;

[floorTex,wallTex,ceilTex].forEach(t=>{
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
});

const roomSize=8, height=3;

/* Пол / потолок */
const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(roomSize,roomSize),
  new THREE.MeshStandardMaterial({map:floorTex})
);
floor.rotation.x=-Math.PI/2;scene.add(floor);

const ceil=new THREE.Mesh(
  new THREE.PlaneGeometry(roomSize,roomSize),
  new THREE.MeshStandardMaterial({map:ceilTex})
);
ceil.position.y=height;
ceil.rotation.x=Math.PI/2;
scene.add(ceil);

/* Стены */
function wall(x,z,r){
  const w=new THREE.Mesh(
    new THREE.PlaneGeometry(roomSize,height),
    new THREE.MeshStandardMaterial({map:wallTex})
  );
  w.position.set(x,height/2,z);
  w.rotation.y=r;
  scene.add(w);
}
wall(0,-roomSize/2,0);
wall(0, roomSize/2,Math.PI);
wall(-roomSize/2,0,Math.PI/2);
wall(roomSize/2,0,-Math.PI/2);

/* ДВЕРЬ */
const doorBase=new THREE.Mesh(
  new THREE.BoxGeometry(1.6,2.4,0.12),
  new THREE.MeshStandardMaterial({color:0x000000})
);
doorBase.position.set(0,1.2,roomSize/2-0.06);
scene.add(doorBase);

const doorFront=new THREE.Mesh(
  new THREE.PlaneGeometry(1.6,2.4),
  new THREE.MeshStandardMaterial({
    map:doorTex,
    transparent:true,
    depthTest:false
  })
);
doorFront.position.set(0,1.2,roomSize/2+0.01);
doorFront.rotation.y=Math.PI;
scene.add(doorFront);

/* ОКНО — ЛЕВАЯ СТЕНА */
const wx=-roomSize/2+0.01, wy=1.8, wz=0;

/* Свет окна */
const light=new THREE.PointLight(0xffffff,1.4,5);
light.position.set(wx+0.3,wy,wz);
scene.add(light);

/* Рама */
const frameMat=new THREE.MeshStandardMaterial({color:0x222222});
const glassMat=new THREE.MeshStandardMaterial({
  color:0xffffff,
  emissive:0xffffff,
  emissiveIntensity:1.3
});

/* Стекло */
const glass=new THREE.Mesh(
  new THREE.PlaneGeometry(1.2,1.2),
  glassMat
);
glass.position.set(wx,wy,wz);
glass.rotation.y=-Math.PI/2;
scene.add(glass);

/* Перекладины */
const barV=new THREE.Mesh(
  new THREE.BoxGeometry(0.05,1.2,0.05),frameMat);
barV.position.set(wx+0.01,wy,wz);
scene.add(barV);

const barH=new THREE.Mesh(
  new THREE.BoxGeometry(1.2,0.05,0.05),frameMat);
barH.position.set(wx+0.01,wy,wz);
scene.add(barH);

/* Подоконник */
const sill=new THREE.Mesh(
  new THREE.BoxGeometry(1.3,0.08,0.3),
  frameMat
);
sill.position.set(wx+0.15,wy-0.65,wz);
scene.add(sill);

/* Управление */
let yaw=0,move={f:0,s:0};
addEventListener("mousemove",e=>{
  if(!started)return;
  yaw-=e.movementX*0.002;
  camera.rotation.y=yaw;
});
addEventListener("keydown",e=>{
  if(e.key==="w")move.f=1;
  if(e.key==="s")move.f=-1;
  if(e.key==="a")move.s=-1;
  if(e.key==="d")move.s=1;
});
addEventListener("keyup",e=>{
  if("ws".includes(e.key))move.f=0;
  if("ad".includes(e.key))move.s=0;
});

/* Анимация */
function animate(){
  requestAnimationFrame(animate);
  if(started){
    const sp=0.05, lim=roomSize/2-0.4;
    camera.position.x=Math.max(-lim,Math.min(lim,camera.position.x+Math.cos(yaw)*move.s*sp));
    camera.position.z=Math.max(-lim,Math.min(lim,camera.position.z-Math.sin(yaw)*move.f*sp));
    openText.style.opacity=camera.position.distanceTo(doorBase.position)<1.8?1:0;
  }
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
