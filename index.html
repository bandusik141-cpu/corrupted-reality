<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Corrupted Reality</title>

<style>
  body { margin:0; overflow:hidden; background:black; }
  canvas { display:block; }

  /* Меню */
  #menu {
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    font-family:monospace;
    z-index:10;
  }
  #menu button {
    margin:10px;
    padding:10px 30px;
    font-size:20px;
  }

  /* OPEN */
  #openText {
    position:fixed;
    bottom:20%;
    width:100%;
    text-align:center;
    font-family:monospace;
    font-size:22px;
    color:white;
    opacity:0;
    transition:opacity 0.2s;
    pointer-events:none;
    z-index:5;
  }

  /* Виньетка */
  #vignette {
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(50,25,0,0.8) 100%);
    z-index:4;
  }

  /* Джойстик */
  #joystick {
    position:fixed;
    left:0;
    top:0;
    width:50%;
    height:100%;
    touch-action:none;
    z-index:3;
  }
  #stick {
    position:absolute;
    left:50px;
    top:50%;
    width:40px;
    height:40px;
    background:rgba(255,255,255,0.5);
    border-radius:50%;
    transform:translateY(-50%);
  }
</style>
</head>

<body>

<div id="menu">
  <h1>Corrupted Reality</h1>
  <button id="play">Play</button>
  <button onclick="alert('Soon')">Settings</button>
</div>

<div id="openText">OPEN</div>
<div id="joystick"><div id="stick"></div></div>
<div id="vignette"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
let started=false;
document.getElementById("play").onclick=()=>{
  document.getElementById("menu").style.display="none";
  started=true;
};

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111111);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,100);
camera.position.set(0,1.6,2);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* Свет */
scene.add(new THREE.AmbientLight(0x886644,0.45));

/* Текстуры */
const loader=new THREE.TextureLoader();
const floorTex=loader.load("https://i.postimg.cc/qMrFMmrT/tmpfdd10f506ecf00611c27c317004b7676.jpg");
const wallTex=loader.load("https://i.postimg.cc/J4wQ1tbR/Untitled30-20260102223542.png");
const ceilTex=loader.load("https://i.postimg.cc/wvdryFNx/Untitled32-20260102230233.png");

floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping;
wallTex.wrapS=wallTex.wrapT=THREE.RepeatWrapping;
ceilTex.wrapS=ceilTex.wrapT=THREE.RepeatWrapping;

floorTex.repeat.set(2,2);
wallTex.repeat.set(2,1);
ceilTex.repeat.set(2,2);

/* Комната */
const roomSize=8;
const height=3;

const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(roomSize,roomSize),
  new THREE.MeshStandardMaterial({map:floorTex})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

const ceiling=new THREE.Mesh(
  new THREE.PlaneGeometry(roomSize,roomSize),
  new THREE.MeshStandardMaterial({map:ceilTex})
);
ceiling.position.y=height;
ceiling.rotation.x=Math.PI/2;
scene.add(ceiling);

function wall(x,z,rot){
  const w=new THREE.Mesh(
    new THREE.PlaneGeometry(roomSize,height),
    new THREE.MeshStandardMaterial({map:wallTex})
  );
  w.position.set(x,height/2,z);
  w.rotation.y=rot;
  scene.add(w);
}
wall(0,-roomSize/2,0);
wall(0, roomSize/2,Math.PI);
wall(-roomSize/2,0,Math.PI/2);
wall(roomSize/2,0,-Math.PI/2);

/* Дверь */
const door=new THREE.Mesh(
  new THREE.PlaneGeometry(1.2,2.2),
  new THREE.MeshStandardMaterial({color:0x3a2a1a})
);
door.position.set(0,1.1,roomSize/2-0.01);
door.rotation.y=Math.PI;
scene.add(door);

/* Управление */
let yaw=0,look=false,lastX=0;
addEventListener("mousedown",e=>{look=true;lastX=e.clientX;});
addEventListener("mousemove",e=>{
  if(!look)return;
  yaw-=(e.clientX-lastX)*0.005;
  lastX=e.clientX;
  camera.rotation.set(0,yaw,0);
});
addEventListener("mouseup",()=>look=false);

let move={f:0,s:0};
addEventListener("keydown",e=>{
  if(e.key==="w")move.f=1;
  if(e.key==="s")move.f=-1;
  if(e.key==="a")move.s=-1;
  if(e.key==="d")move.s=1;
});
addEventListener("keyup",()=>move={f:0,s:0});

/* Джойстик */
const stick=document.getElementById("stick");
let joy=false;
document.getElementById("joystick").ontouchstart=()=>joy=true;
document.getElementById("joystick").ontouchmove=e=>{
  if(!joy)return;
  const y=e.touches[0].clientY-innerHeight/2;
  move.f=-y/100;
};
document.getElementById("joystick").ontouchend=()=>{
  joy=false; move.f=0; stick.style.top="50%";
};

/* Анимация */
/* Анимация */
function animate(){
  requestAnimationFrame(animate);
  if(started){
    const speed = 0.05;
const lim = roomSize / 2 - 0.4;

const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
const right   = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

// пробуем движение вперёд
let newZ = camera.position.z - forward.z * move.f * speed;
if (newZ > -lim && newZ < lim) {
  camera.position.z = newZ;
}

// пробуем движение вбок
let newX = camera.position.x + right.x * move.s * speed;
if (newX > -lim && newX < lim) {
  camera.position.x = newX;
}

    /* OPEN */
    const d=camera.position.distanceTo(door.position);
    document.getElementById("openText").style.opacity=d<1.8?1:0;
  }
  renderer.render(scene,camera);
}
animate();

onresize=()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
};
</script>
</body>
</html>
