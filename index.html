<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Corrupted Reality — Prototype</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #hint {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: monospace;
      opacity: 0.6;
      z-index: 5;
    }
  </style>
</head>

<body>

<div id="hint">WASD — ходьба | Мышь / палец — осмотр</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  background="color: #111">

  <!-- ИГРОК -->
  <a-entity
    id="player"
    position="0 1.6 0"
    camera
    wasd-controls="acceleration: 10"
    look-controls="mouseEnabled: true; touchEnabled: true">
  </a-entity>

  <!-- ПОЛ -->
  <a-plane rotation="-90 0 0" width="10" height="10" color="#444"></a-plane>

  <!-- СТЕНЫ -->
  <a-box position="0 1 -5" width="10" height="2" depth="0.2" color="#666"></a-box>
  <a-box position="0 1 5" width="10" height="2" depth="0.2" color="#666"></a-box>
  <a-box position="5 1 0" width="0.2" height="2" depth="10" color="#666"></a-box>
  <a-box position="-5 1 0" width="0.2" height="2" depth="10" color="#666"></a-box>

  <!-- ПОТОЛОК -->
  <a-plane position="0 2 0" rotation="90 0 0" width="10" height="10" color="#333"></a-plane>

  <!-- СВЕТ -->
  <a-light type="ambient" intensity="0.8"></a-light>
</a-scene>

<script>
  // 🔒 ЖЁСТКО блокируем взгляд вверх/вниз
  const player = document.querySelector('#player');

  player.addEventListener('componentchanged', (e) => {
    if (e.detail.name === 'rotation') {
      player.object3D.rotation.x = 0;
    }
  });
</script>

</body>
</html>
