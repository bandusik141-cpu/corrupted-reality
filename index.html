<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Corrupted Reality — Textured Room</title>

  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }

    #hint {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: monospace;
      opacity: 0.6;
      z-index: 5;
      pointer-events: none;
    }

    #joystick {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 50%;
      height: 100%;
      z-index: 10;
      touch-action: none;
    }

    #stick {
      position: absolute;
      left: 50px;
      top: calc(50% - 20px);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
    }
  </style>
</head>

<body>

<div id="hint">WASD / ⬅️➡️ — ходьба | Мышь / палец — осмотр</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
  // ===== СЦЕНА =====
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  // ===== КАМЕРА =====
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0,1.6,3);

  // ===== РЕНДЕР =====
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // ===== СВЕТ =====
  scene.add(new THREE.AmbientLight(0xffffff,1));

  // ===== ЗАГРУЗКА ТЕКСТУР =====
  const loader = new THREE.TextureLoader();

  const floorTexture = loader.load('https://i.postimg.cc/qMrFMmrT/tmpfdd10f506ecf00611c27c317004b7676.jpg');
  floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
  floorTexture.repeat.set(2,2);

  const wallTexture = loader.load('https://i.postimg.cc/jdqhFBKJ/Untitled30-20260102223542.png');
  wallTexture.wrapS = wallTexture.wrapT = THREE.RepeatWrapping;
  wallTexture.repeat.set(2,1);

  const ceilingTexture = loader.load('https://i.postimg.cc/RCLRG4k8/Untitled31-20260102223918.png');
  ceilingTexture.wrapS = ceilingTexture.wrapT = THREE.RepeatWrapping;
  ceilingTexture.repeat.set(2,2);

  // ===== ПОЛ =====
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(20,20),
    new THREE.MeshStandardMaterial({ map: floorTexture })
  );
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  // ===== ПОТОЛОК =====
  const ceiling = new THREE.Mesh(
    new THREE.PlaneGeometry(20,20),
    new THREE.MeshStandardMaterial({ map: ceilingTexture })
  );
  ceiling.position.y = 3;
  ceiling.rotation.x = Math.PI/2;
  scene.add(ceiling);

  // ===== СТЕНЫ =====
  const wallMaterial = new THREE.MeshStandardMaterial({ map: wallTexture });

  const wall1 = new THREE.Mesh(new THREE.PlaneGeometry(20,3), wallMaterial);
  wall1.position.set(0,1.5,-10);
  scene.add(wall1);

  const wall2 = new THREE.Mesh(new THREE.PlaneGeometry(20,3), wallMaterial);
  wall2.position.set(0,1.5,10);
  wall2.rotation.y = Math.PI;
  scene.add(wall2);

  const wall3 = new THREE.Mesh(new THREE.PlaneGeometry(20,3), wallMaterial);
  wall3.position.set(-10,1.5,0);
  wall3.rotation.y = Math.PI/2;
  scene.add(wall3);

  const wall4 = new THREE.Mesh(new THREE.PlaneGeometry(20,3), wallMaterial);
  wall4.position.set(10,1.5,0);
  wall4.rotation.y = -Math.PI/2;
  scene.add(wall4);

  // ===== ОРИЕНТИР (куб) =====
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshStandardMaterial({ color:0xaa0000 })
  );
  box.position.set(0,0.5,-5);
  scene.add(box);

  // ===== ОСМОТР =====
  let yaw=0, looking=false, lastX=0, touchingJoystick=false;

  function lookStart(x){ looking=true; lastX=x; }
  function lookMove(x){ if(!looking) return; yaw -= (x-lastX)*0.005; lastX=x; camera.rotation.set(0,yaw,0); }
  function lookEnd(){ looking=false; }

  document.addEventListener('mousedown', e=>lookStart(e.clientX));
  document.addEventListener('mousemove', e=>lookMove(e.clientX));
  document.addEventListener('mouseup', lookEnd);

  document.addEventListener('touchstart', e=>{
    for(let t of e.touches){ if(t.clientX>window.innerWidth/2) lookStart(t.clientX); }
  });
  document.addEventListener('touchmove', e=>{
    for(let t of e.touches){ if(t.clientX>window.innerWidth/2) lookMove(t.clientX); }
  });
  document.addEventListener('touchend', lookEnd);

  // ===== ДВИЖЕНИЕ =====
  let move={forward:0,side:0};
  let walkSpeed=0.06;

  document.addEventListener('keydown', e=>{
    if(e.key==='w'||e.key==='W') move.forward=1;
    if(e.key==='s'||e.key==='S') move.forward=-1;
    if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft') move.side=-1;
    if(e.key==='d'||e.key==='D'||e.key==='ArrowRight') move.side=1;
  });

  document.addEventListener('keyup', e=>{
    if(['w','W','s','S'].includes(e.key)) move.forward=0;
    if(['a','A','d','D','ArrowLeft','ArrowRight'].includes(e.key)) move.side=0;
  });

  // ===== ДЖОЙСТИК =====
  const joystick = document.getElementById('joystick');
  const stick = document.getElementById('stick');
  const center = { x:50, y:window.innerHeight/2 };
  const maxDist = 40;
  let joyActive=false;

  joystick.addEventListener('touchstart', e=>{ touchingJoystick=true; joyActive=true; });
  joystick.addEventListener('touchmove', e=>{
    if(!joyActive) return;
    const rect = joystick.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left;
    const y = e.touches[0].clientY - rect.top;

    let dx = x-center.x;
    let dy = y-center.y;
    const dist = Math.min(Math.hypot(dx,dy), maxDist);
    const angle = Math.atan2(dy,dx);
    dx = Math.cos(angle)*dist; dy = Math.sin(angle)*dist;

    stick.style.left = (center.x+dx-20)+'px';
    stick.style.top  = (center.y+dy-20)+'px';

    move.side = dx/maxDist;
    move.forward = -dy/maxDist;
  });
  joystick.addEventListener('touchend', ()=>{
    touchingJoystick=false;
    joyActive=false;
    move.forward=0; move.side=0;
    stick.style.left='50px';
    stick.style.top=(window.innerHeight/2-20)+'px';
  });

  // ===== АНИМАЦИЯ =====
  function animate(){
    requestAnimationFrame(animate);

    const forward = new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));

    camera.position.add(forward.multiplyScalar(-move.forward*walkSpeed));
    camera.position.add(right.multiplyScalar(move.side*walkSpeed));

    renderer.render(scene,camera);
  }
  animate();

  // ===== РЕСАЙЗ =====
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
</script>

</body>
</html>
