<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Corrupted Reality</title>
<style>
body{margin:0;overflow:hidden;background:black;}
canvas{display:block;}
#menu{position:fixed;inset:0;background:black;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;font-family:monospace;z-index:10;}
#menu button{margin:10px;padding:10px 30px;font-size:20px;}
#openText{position:fixed;bottom:20%;width:100%;text-align:center;font-family:monospace;font-size:22px;color:white;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5;}
#joystickBase{position:fixed;bottom:10%;left:10%;width:120px;height:120px;background:rgba(255,255,255,0.1);border-radius:50%;touch-action:none;display:none;z-index:10;}
#joystickThumb{position:absolute;width:60px;height:60px;background:rgba(255,255,255,0.3);border-radius:50%;left:30px;top:30px;pointer-events:none;}
</style>
</head>
<body>
<div id="menu">
  <h1>Corrupted Reality</h1>
  <button id="play">Play</button>
  <button onclick="alert('Soon')">Settings</button>
</div>
<div id="openText">OPEN</div>
<div id="joystickBase"><div id="joystickThumb"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
let started=false;
play.onclick=()=>{
  menu.style.display="none";
  started=true;
  if(window.innerWidth<900) document.getElementById('joystickBase').style.display='block';
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111111);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,100);
camera.position.set(0,1.6,2);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* Свет */
scene.add(new THREE.AmbientLight(0x664422,0.45));

/* Текстуры */
const loader=new THREE.TextureLoader();
const floorTex=loader.load("https://i.postimg.cc/qMrFMmrT/tmpfdd10f506ecf00611c27c317004b7676.jpg");
const wallTex=loader.load("https://i.postimg.cc/J4wQ1tbR/Untitled30-20260102223542.png");
const ceilTex=loader.load("https://i.postimg.cc/wvdryFNx/Untitled32-20260102230233.png");
const doorTex=loader.load("https://i.postimg.cc/9QJ2cSNz/pngtree-door-on-old-wall-png-image-11573440.png");
doorTex.flipY=false;
[floorTex,wallTex,ceilTex].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;});

const roomSize=8, height=3;

/* Пол и потолок */
const floor=new THREE.Mesh(new THREE.PlaneGeometry(roomSize,roomSize), new THREE.MeshStandardMaterial({map:floorTex}));
floor.rotation.x=-Math.PI/2; scene.add(floor);
const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(roomSize,roomSize), new THREE.MeshStandardMaterial({map:ceilTex}));
ceiling.position.y=height; ceiling.rotation.x=Math.PI; scene.add(ceiling);

/* Стены */
function wall(x,z,r){const w=new THREE.Mesh(new THREE.PlaneGeometry(roomSize,height), new THREE.MeshStandardMaterial({map:wallTex}));
w.position.set(x,height/2,z); w.rotation.y=r; scene.add(w);}
wall(0,-roomSize/2,0); wall(0, roomSize/2,Math.PI); wall(-roomSize/2,0,Math.PI/2); wall(roomSize/2,0,-Math.PI/2);

/* Дверь */
const doorBase=new THREE.Mesh(new THREE.BoxGeometry(1.6,2.4,0.15), new THREE.MeshStandardMaterial({color:0x2a1a10, roughness:0.8}));
doorBase.position.set(0,1.2,roomSize/2-0.08); scene.add(doorBase);

const doorFront=new THREE.Mesh(new THREE.PlaneGeometry(1.55,2.35),
  new THREE.MeshStandardMaterial({
    map:doorTex, transparent:true, emissive:0x222222, emissiveIntensity:0.6,
    polygonOffset:true, polygonOffsetFactor:-1, polygonOffsetUnits:1
  })
);
doorFront.position.set(0,1.2,roomSize/2+0.01); doorFront.rotation.y=Math.PI; scene.add(doorFront);

/* Окно */
const windowGroup=new THREE.Group();
windowGroup.position.set(-roomSize/2+0.01,1.8,0); windowGroup.rotation.y=Math.PI/2;
const windowLight=new THREE.PointLight(0xffffff,1.2,5); windowLight.position.set(0,0,0.3); windowGroup.add(windowLight);
const glass=new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.4), new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:1.2})); windowGroup.add(glass);
const barMat=new THREE.MeshStandardMaterial({color:0x222222});
windowGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.05,1.4,0.05),barMat));
windowGroup.add(new THREE.Mesh(new THREE.BoxGeometry(1.4,0.05,0.05),barMat));
const sill=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.1,0.4), new THREE.MeshStandardMaterial({color:0x1a1a1a}));
sill.position.set(0,-0.75,0.2); windowGroup.add(sill); scene.add(windowGroup);

/* УПРАВЛЕНИЕ */
let yaw=0, move={f:0,s:0};

// ПК клавиши
addEventListener("keydown", e=>{if(e.key==="w") move.f=1; if(e.key==="s") move.f=-1; if(e.key==="a") move.s=-1; if(e.key==="d") move.s=1;});
addEventListener("keyup", e=>{if(e.key==="w"||e.key==="s") move.f=0; if(e.key==="a"||e.key==="d") move.s=0;});

// ПК мышь горизонтально
addEventListener("mousemove", e=>{if(e.buttons) yaw -= e.movementX*0.002;});

// Телефон джойстик
const joystickBase=document.getElementById('joystickBase'); const joystickThumb=document.getElementById('joystickThumb');
let joyStartX=0, joyStartY=0, joyX=0, joyY=0, touching=false;
joystickBase.addEventListener('touchstart', e=>{e.preventDefault(); touching=true; joyStartX=e.touches[0].clientX; joyStartY=e.touches[0].clientY;});
joystickBase.addEventListener('touchmove', e=>{
  e.preventDefault(); if(!touching) return;
  let dx=e.touches[0].clientX-joyStartX; let dy=e.touches[0].clientY-joyStartY; const max=50;
  joyX=Math.max(-1,Math.min(1,dx/max)); joyY=Math.max(-1,Math.min(1,dy/max));
  joystickThumb.style.left=(30+joyX*60)+'px'; joystickThumb.style.top=(30+joyY*60)+'px';
});
joystickBase.addEventListener('touchend', e=>{touching=false; joyX=0; joyY=0; joystickThumb.style.left='30px'; joystickThumb.style.top='30px';});

// Правая половина экрана - поворот
let touchRotX=0;
addEventListener('touchstart', e=>{if(e.touches[0].clientX>window.innerWidth/2) touchRotX=e.touches[0].clientX;});
addEventListener('touchmove', e=>{if(e.touches[0].clientX>window.innerWidth/2){let dx=e.touches[0].clientX-touchRotX; yaw-=dx*0.01; touchRotX=e.touches[0].clientX;}});

/* Анимация */
function animate(){
  requestAnimationFrame(animate);
  if(started){
    camera.rotation.y=yaw;
    const sp=0.05; const lim=roomSize/2-0.4;
    // ПК движение
    camera.position.x+=Math.sin(yaw)*move.f*sp+Math.cos(yaw)*move.s*sp;
    camera.position.z+=Math.cos(yaw)*move.f*sp-Math.sin(yaw)*move.s*sp;
    // Телефон движение
    camera.position.x+=Math.sin(yaw)*joyY*sp+Math.cos(yaw)*joyX*sp;
    camera.position.z+=Math.cos(yaw)*joyY*sp-Math.sin(yaw)*joyX*sp;
    // OPEN текст
    openText.style.opacity=camera.position.distanceTo(doorBase.position)<1.8?1:0;
  }
  renderer.render(scene,camera);
}
animate();

/* Ресайз */
onresize=()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);};
</script>
</body>
</html>
