<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <!-- ВАЖНО для телефона -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Corrupted Reality — Test</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
  </style>
</head>

<body>

<a-scene
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="antialias: true; precision: mediump"
  background="color: #111">

  <!-- КАМЕРА (ОБЯЗАТЕЛЬНО ТАК) -->
  <a-entity position="0 1.6 3">
    <a-camera></a-camera>
  </a-entity>

  <!-- ПОЛ -->
  <a-plane
    rotation="-90 0 0"
    width="10"
    height="10"
    color="green">
  </a-plane>

  <!-- КУБ ПЕРЕД КАМЕРОЙ -->
  <a-box
    position="0 1 -3"
    width="1"
    height="1"
    depth="1"
    color="red">
  </a-box>

  <!-- СВЕТ -->
  <a-light type="ambient" intensity="1"></a-light>

</a-scene>

</body>
</html>
