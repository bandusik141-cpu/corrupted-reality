<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrupted Reality</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: monospace;
}

/* Общий экран */
.screen {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

/* Главное меню */
#menu {
  display: flex;
}

#menu h1 {
  margin-bottom: 40px;
  font-size: 32px;
}

button {
  background: none;
  border: 1px solid white;
  color: white;
  padding: 10px 30px;
  font-size: 18px;
  font-family: monospace;
  cursor: pointer;
}

button:hover {
  background: white;
  color: black;
}

/* Экран игры */
#game {
  background: url("room.png") center / cover no-repeat;
  justify-content: flex-end;
}

/* Текстовое окно */
#textbox {
  width: 100%;
  background: rgba(0,0,0,0.75);
  padding: 20px;
  box-sizing: border-box;
}

#text {
  font-size: 18px;
  line-height: 1.6;
  white-space: pre-line;
}

#next {
  margin-top: 15px;
  font-size: 16px;
}
</style>
</head>

<body>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="menu" class="screen">
  <h1>Corrupted Reality</h1>
  <button onclick="startGame()">Start</button>
</div>

<!-- ИГРА -->
<div id="game" class="screen">
  <div id="textbox">
    <div id="text"></div>
    <button id="next" onclick="nextText()">Next</button>
  </div>
</div>

<script>
/* ---------- ТЕКСТ ДНЯ 1 ---------- */

const day1 = [
  "День 1\n\nТы проснулся.",
  "Потолок знакомый.\nКомната выглядит так же, как и всегда.",
  "Ты лежишь несколько секунд, глядя в одну точку.\nПотом встаёшь.",
  "Сегодня обычный день.\n\nНичего особенного не произойдёт."
];

let index = 0;

/* ---------- ЛОГИКА ---------- */

function startGame() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "flex";
  index = 0;
  showText();
}

function showText() {
  document.getElementById("text").textContent = day1[index];
}

function nextText() {
  index++;
  if (index < day1.length) {
    showText();
  } else {
    // позже тут будет переход к дню 2
    document.getElementById("text").textContent =
      "День закончился.";
    document.getElementById("next").style.display = "none";
  }
}
</script>

</body>
</html>
