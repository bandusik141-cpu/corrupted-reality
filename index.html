<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Corrupted Reality — Test</title>

  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }
    #hint {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: monospace;
      opacity: 0.6;
    }
  </style>
</head>

<body>
<div id="hint">Проведи пальцем / мышью — осмотр</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
  // СЦЕНА
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  // КАМЕРА
  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 1.6, 3);

  // РЕНДЕР
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // СВЕТ
  scene.add(new THREE.AmbientLight(0xffffff, 1));

  // ПОЛ
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10, 10),
    new THREE.MeshStandardMaterial({ color: 0x00aa00 })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // КУБ
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color: 0xaa0000 })
  );
  box.position.set(0, 1, -3);
  scene.add(box);

  // ОСМОТР ВЛЕВО / ВПРАВО
  let yaw = 0;
  let isTouching = false;
  let lastX = 0;

  function start(x) {
    isTouching = true;
    lastX = x;
  }

  function move(x) {
    if (!isTouching) return;
    yaw -= (x - lastX) * 0.005;
    lastX = x;
    camera.rotation.set(0, yaw, 0);
  }

  function end() {
    isTouching = false;
  }

  // МЫШЬ
  document.addEventListener('mousedown', e => start(e.clientX));
  document.addEventListener('mousemove', e => move(e.clientX));
  document.addEventListener('mouseup', end);

  // ТАЧ
  document.addEventListener('touchstart', e => start(e.touches[0].clientX));
  document.addEventListener('touchmove', e => move(e.touches[0].clientX));
  document.addEventListener('touchend', end);

  // РЕНДЕР ЦИКЛ
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }

  animate();

  // РЕСАЙЗ
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
